<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Eval · Setup Studio</title>
<style>
  :root {
    --bg0:#0a0c11; --bg1:#10141d; --panel:#141925; --card:#171d2a; --card2:#1c2333;
    --line:#252c3a; --line2:#2f3849; --txt:#e8ebf2; --muted:#7e879b; --muted2:#5a6276;
    --accent:#4ade80; --accent-d:#06210f;
    /* updated.png legend colors */
    --input:#5b8bf0; --storage:#5fd07a; --process:#f0a94a; --eval:#a78bfa; --output:#c9d0dc;
    --A:#3b82f6; --B:#f59e0b; --gold:#e0a32e; --danger:#f2555a;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; color:var(--txt);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { background:radial-gradient(1200px 700px at 50% -10%, #19202e 0%, var(--bg1) 45%, var(--bg0) 100%);
    background-attachment:fixed; }
  a { color:var(--input); }
  .mono { font-family:ui-monospace,"SF Mono",Menlo,monospace; letter-spacing:.4px; }

  /* ---------- top bar ---------- */
  #bar { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:16px;
    padding:12px 22px; background:rgba(16,20,29,.82); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:11px; }
  .brand .dot { width:10px; height:10px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 12px var(--accent); }
  .brand h1 { font-size:15px; font-weight:680; margin:0; letter-spacing:.2px; }
  .brand span { font-size:11px; color:var(--muted); }
  .spacer { flex:1; }
  .mockpill { font-size:10px; color:#ffcf87; background:rgba(240,169,74,.12);
    border:1px solid rgba(240,169,74,.4); padding:5px 11px; border-radius:20px; font-weight:600;
    letter-spacing:.5px; }
  #resetBtn { background:#1c2230; color:var(--muted); border:1px solid var(--line);
    border-radius:8px; padding:7px 13px; font-size:12px; cursor:pointer; }
  #resetBtn:hover { border-color:var(--danger); color:var(--danger); }

  /* ---------- layout ---------- */
  #shell { display:flex; gap:0; align-items:flex-start; }
  #nav { position:sticky; top:57px; width:290px; flex:none; padding:22px 16px 40px;
    height:calc(100vh - 57px); overflow-y:auto; border-right:1px solid var(--line); }
  #nav .navlead { font-size:10.5px; color:var(--muted2); text-transform:uppercase;
    letter-spacing:1.2px; margin:0 0 12px 10px; }
  .navstep { display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:11px;
    cursor:pointer; margin-bottom:3px; border:1px solid transparent; transition:all .12s; }
  .navstep:hover { background:#161c29; }
  .navstep.active { background:#1a2233; border-color:var(--line2); }
  .navstep.locked { opacity:.4; cursor:not-allowed; }
  .navstep .ni { width:26px; height:26px; border-radius:8px; flex:none; display:flex;
    align-items:center; justify-content:center; font-size:12px; font-weight:700;
    background:#1c2432; border:1px solid var(--line2); color:var(--muted); }
  .navstep.active .ni { background:var(--accent); color:var(--accent-d); border-color:var(--accent); }
  .navstep.done .ni { background:#16351f; color:var(--accent); border-color:#1f5230; }
  .navstep .nt { font-size:13px; font-weight:560; }
  .navstep .ns { font-size:10.5px; color:var(--muted2); margin-top:1px; }
  .navstep .lc { width:8px; height:8px; border-radius:2px; margin-left:auto; flex:none; }

  #main { flex:1; min-width:0; padding:30px 40px 90px; max-width:1180px; margin:0 auto; }
  .stephead { display:flex; align-items:flex-start; gap:16px; margin-bottom:6px; }
  .steptag { font-size:11px; font-weight:700; letter-spacing:1px; padding:6px 12px;
    border-radius:8px; margin-bottom:10px; display:inline-block; }
  .stephead h2 { font-size:25px; font-weight:730; margin:0 0 6px; }
  .stephead p.lead { color:var(--muted); font-size:14px; margin:0; max-width:720px; line-height:1.55; }
  .stepicon { width:52px; height:52px; border-radius:14px; flex:none; display:flex;
    align-items:center; justify-content:center; font-size:24px; margin-left:auto; }

  /* ---------- generic cards ---------- */
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:22px 24px; margin-top:18px; }
  .card.tint-input   { border-top:3px solid var(--input); }
  .card.tint-storage { border-top:3px solid var(--storage); }
  .card.tint-process { border-top:3px solid var(--process); }
  .card.tint-eval    { border-top:3px solid var(--eval); }
  .card.tint-output  { border-top:3px solid var(--output); }
  .card h3 { margin:0 0 4px; font-size:16px; font-weight:650; display:flex; align-items:center; gap:9px; }
  .card .desc { color:var(--muted); font-size:12.5px; margin:0 0 16px; line-height:1.5; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  @media (max-width:900px){ .grid2,.grid3{ grid-template-columns:1fr; } #nav{ display:none; } }

  /* ---------- forms ---------- */
  label.fld { display:block; margin-bottom:14px; }
  label.fld .lt { font-size:11.5px; color:var(--muted); display:block; margin-bottom:6px;
    text-transform:uppercase; letter-spacing:.5px; }
  input[type=text], input[type=number], input[type=password], select, textarea {
    width:100%; background:#0f1420; color:var(--txt); border:1px solid var(--line2);
    border-radius:9px; padding:10px 12px; font-size:13px; font-family:inherit; }
  textarea { resize:vertical; min-height:70px; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--input); }
  .hintline { font-size:11px; color:var(--muted2); margin-top:5px; }

  /* buttons */
  button { font-family:inherit; }
  .btn { background:#1c2230; color:var(--txt); border:1px solid var(--line2);
    border-radius:10px; padding:9px 16px; font-size:13px; cursor:pointer; transition:all .12s; }
  .btn:hover { border-color:#3a4456; background:#222a3a; }
  .btn.primary { background:var(--accent); color:var(--accent-d); border-color:var(--accent); font-weight:680; }
  .btn.primary:hover { filter:brightness(1.08); }
  .btn.ghost { background:transparent; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn.sm { padding:6px 11px; font-size:12px; }

  /* choice tiles (BYOA/BYOM, judge type) */
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; }
  .tile { border:1.5px solid var(--line2); border-radius:14px; padding:18px; cursor:pointer;
    background:#141a26; transition:all .14s; position:relative; }
  .tile:hover { border-color:#3f4a5e; transform:translateY(-1px); }
  .tile.sel { border-color:var(--accent); background:#13241a; box-shadow:0 0 0 1px var(--accent) inset; }
  .tile .ttl { font-size:14.5px; font-weight:650; display:flex; align-items:center; gap:8px; }
  .tile .tsub { font-size:12px; color:var(--muted); margin-top:6px; line-height:1.45; }
  .tile .tcheck { position:absolute; top:12px; right:12px; width:20px; height:20px; border-radius:50%;
    border:1.5px solid var(--line2); display:flex; align-items:center; justify-content:center;
    font-size:12px; color:transparent; }
  .tile.sel .tcheck { background:var(--accent); border-color:var(--accent); color:var(--accent-d); }

  /* pills / tags */
  .pill { display:inline-flex; align-items:center; gap:6px; font-size:11px; padding:4px 10px;
    border-radius:20px; border:1px solid var(--line2); color:var(--muted); }
  .pill.ok { color:var(--accent); border-color:#1f5230; background:#0f1f15; }
  .pill.warn { color:#ffcf87; border-color:rgba(240,169,74,.4); background:rgba(240,169,74,.08); }
  .pill.bad { color:var(--danger); border-color:rgba(242,85,90,.4); background:rgba(242,85,90,.08); }

  /* tables */
  table.tbl { width:100%; border-collapse:collapse; margin-top:4px; }
  table.tbl th { text-align:left; font-size:10.5px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.8px; padding:9px 12px; border-bottom:1px solid var(--line); font-weight:600; }
  table.tbl td { padding:11px 12px; border-bottom:1px solid #1a2130; font-size:13px; vertical-align:middle; }
  table.tbl tr:last-child td { border-bottom:none; }
  .modelchip { display:inline-flex; align-items:center; gap:8px; }
  .modelchip .mid { font-size:10px; color:var(--muted); background:#0f1420; border:1px solid var(--line);
    border-radius:5px; padding:2px 6px; font-family:ui-monospace,monospace; }
  .xbtn { background:none; border:none; color:var(--muted2); cursor:pointer; font-size:15px; }
  .xbtn:hover { color:var(--danger); }

  /* tabs */
  .tabs { display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:2px; flex-wrap:wrap; }
  .tab { padding:10px 15px; font-size:13px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent;
    margin-bottom:-1px; }
  .tab:hover { color:var(--txt); }
  .tab.active { color:var(--txt); border-bottom-color:var(--accent); font-weight:600; }
  .tab .b { display:inline-block; min-width:18px; text-align:center; font-size:10px; background:#222a3a;
    border-radius:10px; padding:1px 6px; margin-left:6px; color:var(--muted); }

  /* dropzone */
  .drop { border:2px dashed var(--line2); border-radius:16px; padding:38px 20px; text-align:center;
    background:#0f1420; transition:all .15s; cursor:pointer; }
  .drop:hover, .drop.over { border-color:var(--accent); background:#0f1c14; }
  .drop .di { font-size:40px; margin-bottom:10px; }
  .drop .dt { font-size:15px; font-weight:600; }
  .drop .ds { font-size:12px; color:var(--muted); margin-top:6px; }

  /* upload cards */
  .ucards { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-top:16px; }
  .ucard { border:1px solid var(--line2); border-radius:13px; background:#141a26; overflow:hidden; }
  .ucard .uthumb { height:150px; background:#0b0f18; display:flex; align-items:center; justify-content:center;
    position:relative; border-bottom:1px solid var(--line); }
  .ucard .uthumb canvas { display:block; }
  .ucard .uthumb .ph { color:var(--muted2); font-size:12px; }
  .ucard .ubody { padding:12px 13px; }
  .ucard .un { font-size:12.5px; font-weight:600; word-break:break-all; }
  .ucard .um { font-size:11px; color:var(--muted); margin-top:4px; display:flex; gap:8px; flex-wrap:wrap; }
  .ucard .urow { display:flex; align-items:center; justify-content:space-between; margin-top:9px; }

  /* pair graph */
  .pairwrap { display:grid; grid-template-columns:340px 1fr; gap:22px; align-items:start; }
  @media (max-width:820px){ .pairwrap{ grid-template-columns:1fr; } }
  .pairlist { max-height:420px; overflow-y:auto; border:1px solid var(--line); border-radius:12px; }
  .pairlist .pr { display:flex; align-items:center; gap:10px; padding:9px 13px; font-size:12.5px;
    border-bottom:1px solid #1a2130; }
  .pairlist .pr:last-child { border-bottom:none; }
  .pairlist .pn { color:var(--muted2); font-family:ui-monospace,monospace; font-size:11px; width:34px; }

  /* scheduler log */
  .log { font-family:ui-monospace,"SF Mono",monospace; font-size:12px; background:#0b0f18;
    border:1px solid var(--line); border-radius:12px; padding:16px 18px; max-height:340px;
    overflow-y:auto; line-height:1.7; }
  .log .lg { color:var(--muted2); } .log .lok { color:var(--accent); } .log .lwarn { color:#ffcf87; }
  .log .lstore { color:var(--storage); } .log .lproc { color:var(--process); }

  /* stat tiles */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; }
  .stat { background:#141a26; border:1px solid var(--line2); border-radius:13px; padding:16px 18px; }
  .stat .sv { font-size:26px; font-weight:730; } .stat .sl { font-size:11.5px; color:var(--muted); margin-top:3px; }

  /* progress bar */
  .pbar { height:8px; background:#0f1420; border-radius:6px; overflow:hidden; border:1px solid var(--line); }
  .pbar > div { height:100%; background:linear-gradient(90deg,var(--process),#f7c877); width:0; transition:width .2s; }

  /* footer nav */
  #foot { position:fixed; bottom:0; left:0; right:0; z-index:20; display:flex; align-items:center; gap:14px;
    padding:14px 40px; background:rgba(16,20,29,.9); backdrop-filter:blur(10px);
    border-top:1px solid var(--line); }
  #foot .fprog { font-size:12px; color:var(--muted); }
  #foot .fprog b { color:var(--txt); }

  /* charts */
  .chartcard { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px 22px; }
  .chartcard h4 { margin:0 0 3px; font-size:14px; font-weight:640; }
  .chartcard .csub { font-size:11.5px; color:var(--muted); margin:0 0 14px; }
  svg text { fill:var(--muted); }
  .legendrow { display:flex; flex-wrap:wrap; gap:12px; margin-top:12px; font-size:11.5px; color:var(--muted); }
  .legendrow .lk { display:inline-flex; align-items:center; gap:6px; }
  .legendrow .sw { width:11px; height:11px; border-radius:3px; }

  .overviewflow { display:flex; flex-direction:column; gap:2px; margin-top:10px; }
  .ovrow { display:flex; align-items:center; gap:14px; padding:13px 16px; border:1px solid var(--line);
    border-radius:12px; background:#141a26; }
  .ovrow .oi { width:34px; height:34px; border-radius:9px; flex:none; display:flex; align-items:center;
    justify-content:center; font-size:16px; }
  .ovrow .ot { font-size:13.5px; font-weight:600; } .ovrow .od { font-size:11.5px; color:var(--muted); margin-top:2px; }
  .ovrow .obadge { margin-left:auto; font-size:10px; color:var(--muted2); text-transform:uppercase; letter-spacing:1px; }
  .ovarrow { text-align:center; color:var(--muted2); font-size:13px; line-height:1; padding:1px; }
  .built { color:var(--accent); border-color:#1f5230 !important; }

  .callout { display:flex; gap:12px; padding:14px 16px; border-radius:12px; background:#141a26;
    border:1px solid var(--line2); font-size:12.5px; color:var(--muted); line-height:1.55; margin-top:16px; }
  .callout .ci { font-size:18px; }
  .kbd { font-family:ui-monospace,monospace; background:#0f1420; border:1px solid var(--line2);
    border-radius:5px; padding:1px 6px; font-size:11.5px; color:var(--txt); }
  /* ---- top3d-style leaderboard ---- */
  .lbhero { background:linear-gradient(180deg,#141a2b,#0e1016); border:1px solid var(--line);
    border-radius:18px; padding:22px 24px; margin-bottom:18px; position:relative; overflow:hidden; }
  .lbhero::before { content:''; position:absolute; inset:0 0 auto 0; height:3px;
    background:linear-gradient(90deg,#a78bfa,#f0a94a,#4ade80); }
  .lbhead { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .lbtitle { font-size:22px; font-weight:750; margin:0; }
  .lbsub { color:var(--muted); font-size:13px; margin:5px 0 0; max-width:560px; line-height:1.5; }
  .lbstat { font-size:12px; color:var(--muted); white-space:nowrap; }
  .livedot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 8px var(--accent); }
  .pills { display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 4px; }
  .pill2 { font-size:12.5px; padding:7px 14px; border-radius:20px; border:1px solid var(--line2);
    background:transparent; color:var(--muted); cursor:pointer; font-family:inherit; transition:all .12s; }
  .pill2:hover { color:var(--txt); border-color:#3f4a5e; }
  .pill2.on { color:#0a0c11; font-weight:650; background:linear-gradient(90deg,#a78bfa,#f0a94a); border-color:transparent; }
  .lbboard { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .lbrow { display:grid; grid-template-columns:56px 1fr 92px 70px 70px 84px; align-items:center;
    padding:14px 18px; border-bottom:1px solid #1a2130; gap:8px; }
  .lbrow:last-child { border-bottom:none; }
  .lbrow:hover:not(.lbrhead) { background:#171d2a; }
  .lbrhead { font-size:10.5px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted2); background:#0f1420; }
  .lbrhead .lc-num, .lbrhead .lc-rank, .lbrhead .lc-model { font-weight:600; }
  .lbrow.first { background:linear-gradient(90deg,rgba(224,163,46,.10),transparent); }
  .lc-num { text-align:right; font-family:ui-monospace,monospace; font-size:13px; color:var(--muted); }
  .rankb { display:inline-flex; width:30px; height:30px; border-radius:9px; align-items:center;
    justify-content:center; font-weight:700; font-size:13px; background:#1c2432; border:1px solid var(--line2); color:var(--muted); }
  .rankb.gold { background:linear-gradient(180deg,#e0a32e,#9c6f1c); color:#0a0c11; border-color:var(--gold); }
  .mname { font-size:15px; font-weight:640; }
  .mvend { font-size:11.5px; color:var(--muted); font-weight:400; margin-left:6px; }
  .mtags { display:flex; gap:6px; flex-wrap:wrap; margin-top:7px; }
  .tag2 { font-size:10.5px; padding:3px 8px; border-radius:5px; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12); color:var(--muted); }
  .tag2.cost { background:rgba(74,222,128,.10); border-color:#1f5230; color:var(--accent); font-family:ui-monospace,monospace; }
  .elo { font-size:17px; color:var(--txt); }
  .elo.gold { color:var(--gold); }
  @media (max-width:720px){ .lbrow { grid-template-columns:40px 1fr 64px 56px; }
    .lbrow .lc-num:nth-child(5), .lbrow .lc-num:nth-child(6){ display:none; } }
</style>
</head>
<body>
<div id="bar">
  <div class="brand">
    <span class="dot"></span>
    <div><h1>3D Eval · Setup Studio</h1><span>Registry → Input → Pairs → Vote → Leaderboard</span></div>
  </div>
  <div class="spacer"></div>
  <span class="mockpill" id="livepill" title="Connecting to the live pipeline…">◍ CONNECTING…</span>
  <button id="exampleBtn" title="Restore the built-in example run (105 demo votes + its leaderboard)">↺ Load example</button>
  <button id="resetBtn">Reset demo</button>
</div>

<div id="shell">
  <nav id="nav"><div class="navlead">Pipeline setup</div><div id="navlist"></div></nav>
  <main id="main"><div id="content"></div></main>
</div>

<div id="foot">
  <button class="btn ghost" id="backBtn">‹ Back</button>
  <div class="fprog">Step <b id="fstep">1</b> of <b id="ftot">8</b> · <span id="fname"></span></div>
  <div class="spacer" style="flex:1"></div>
  <button class="btn primary" id="nextBtn">Continue ›</button>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================= *
 *  BAKED PROJECT DATA (real values from the running pipeline)   *
 * ============================================================= */
let MODELS = [
  { id:'M1', name:'Trellis 2',          vendor:'Microsoft', credits:78 },
  { id:'M2', name:'Tripo 3D-2.5',       vendor:'Tripo',     credits:78 },
  { id:'M3', name:'Meshy 6 Preview',    vendor:'Meshy',     credits:208 },
  { id:'M4', name:'Hyper 3D Rodin 2',   vendor:'Deemos',    credits:104 },
  { id:'M5', name:'Hyper 3D Rodin 2.5', vendor:'Deemos',    credits:104 },
  { id:'M6', name:'Hunyuan 3D Pro',     vendor:'Tencent',   credits:104 },
  { id:'M7', name:'Pixal 3D',           vendor:'Pixal',     credits:94 },
];
let TESTCASES = [
  { id:'TC001', name:'Mecha Dragon'   }, { id:'TC002', name:'Treasure Chest' },
  { id:'TC003', name:'Saguaro Cactus' }, { id:'TC004', name:'Knight Armor'   },
  { id:'TC005', name:'McLaren Spider' },
];
// A couple of small real sample GLBs (served from the project root) for the BYOM
// upload demo. `key` is matched against the registered model label so the sample
// that lands in a row actually belongs to that model when the names line up.
const SAMPLE_GLBS = [
  { key:'meshy', label:'Meshy 6 Preview · TC001 (5 MB)', file:'/TEST CASES/TC001 GLB/TC001_Meshy 6 Preview.glb', tc:'TC001' },
  { key:'tripo', label:'Tripo 3D-2.5 · TC001 (8 MB)',    file:'/TEST CASES/TC001 GLB/TC001_Tripo 3D-2.5.glb',    tc:'TC001' },
];

/* ---- Benchmark demo catalog ------------------------------------------------
   Demo mode never lets the visitor type model or test-case data: it picks from
   the committed catalog (benchmark/catalog.json, served by GET /api/catalog).
   CATALOG_FALLBACK is the offline copy of that file — same ids, same vendors and
   credits as "1 - Registry Layer/models.json" / "prompts.json" — used only when
   the backend is unreachable so the picker still renders. */
const CATALOG_FALLBACK = {
  models: [

function normalizeCatalog(c){
  const src=c||{};
  const models=(src.models||[]).map((m,i)=>({
    id:m.id||('M'+(i+1)), name:m.name||('Model '+(i+1)),
    vendor:(m.vendor!=null?m.vendor:((m.metadata&&m.metadata.vendor)||'')),
    credits:(m.credits!=null?m.credits:((m.metadata&&m.metadata.credits)||'')),
    format:m.format||'glb' }));
  const cases=(src.test_cases||[]).map((t,i)=>({
    id:t.id||('TC'+String(i+1).padStart(3,'0')),
    subject:t.subject||t.label||'', description:t.description||'' }));
  const avail=Array.isArray(src.available)?src.available.slice():null;
  return { models, test_cases:cases, available:avail };
}
// Loaded once and cached. Never rejects: on failure it falls back to the offline
// copy so the demo pickers still render with the right ids.
function ensureCatalog(){
  if(CATALOG) return Promise.resolve(CATALOG);
  if(!catalogPromise){
    catalogPromise = api.catalog().then(c=>{
      const n=normalizeCatalog(c);
      if(!n.models.length) throw new Error('/api/catalog returned no models');
      CATALOG=n; CATALOG_LIVE=true; return CATALOG;
    }).catch(e=>{
      console.warn('/api/catalog unavailable — using the bundled catalog copy', e);
      CATALOG=normalizeCatalog(CATALOG_FALLBACK); CATALOG_LIVE=false; return CATALOG;
    });
  }
  return catalogPromise;
}
const catalogModels = () => (CATALOG||normalizeCatalog(CATALOG_FALLBACK)).models;
const catalogCases  = () => (CATALOG||normalizeCatalog(CATALOG_FALLBACK)).test_cases;
// null = availability unknown (offline / server silent) -> don't block anything.
function catalogAvailable(){
  const a=(CATALOG||{}).available;
  return (Array.isArray(a) && a.length) ? a : null;
}
const tcAvailable = id => { const a=catalogAvailable(); return !a || a.indexOf(id)>=0; };
const isDemo = () => state.mode==='demo';
const sameModelName = (a,b) => String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();

/* Demo selections live in the SAME state slots the rest of the wizard reads
   (state.reg.models / state.bench.cases), so pairs, payloads and validation all
   keep working — the only difference is the values come from the catalog
   verbatim instead of from text inputs. */
function demoModelSelected(id){
  const c=catalogModels().find(m=>m.id===id); if(!c) return false;
  return state.reg.models.some(m=>m.catalogId===id || sameModelName(m.name,c.name));
}
const demoCaseSelected = id => state.bench.cases.some(c=>c.id===id);

// Re-derive the demo selection from the catalog: drops anything unknown, and
// re-copies vendor/credits/format/id so nothing stale or hand-typed survives.
function syncDemoSelections(){
  const cat=catalogModels(), cases=catalogCases();
  if(!cat.length || !cases.length) return;
  const hits = cat.filter(c=>state.reg.models.some(m=>m.catalogId===c.id || sameModelName(m.name,c.name)));
  // Nothing recognisable carried over (e.g. arriving from hand-typed BYOM rows):
  // start the demo with the whole bundled field rather than an empty picker.
  state.reg.models = (hits.length?hits:cat).map(c=>demoModelRec(c));
  const picked = cases.filter(t=>state.bench.cases.some(x=>x.id===t.id));
  const usable = picked.filter(t=>tcAvailable(t.id));
  const chosen = (usable.length?usable:picked);
  state.bench.cases = (chosen.length?chosen:[cases.find(t=>tcAvailable(t.id))||cases[0]])
    .map(t=>({ id:t.id, label:t.subject||'' }));
  state.path='BYOM';
  save();
}
const demoModelRec = c => ({ name:c.name, vendor:c.vendor||'', credits:c.credits||'',
  format:c.format||'glb', source:'BYOM', endpoint:'', apiKey:'', catalogId:c.id });

function toggleDemoModel(id){
  const cat=catalogModels(), c=cat.find(m=>m.id===id); if(!c) return;
  const ix=state.reg.models.findIndex(m=>m.catalogId===id || sameModelName(m.name,c.name));
  if(ix>=0) state.reg.models.splice(ix,1);
  else state.reg.models.push(demoModelRec(c));
  const order=cat.map(m=>m.id);
  state.reg.models.sort((a,b)=>order.indexOf(a.catalogId)-order.indexOf(b.catalogId));
  save();
}
function toggleDemoCase(id){
  const cases=catalogCases(), c=cases.find(t=>t.id===id); if(!c) return;
  const ix=state.bench.cases.findIndex(x=>x.id===id);
  if(ix>=0) state.bench.cases.splice(ix,1);
  else state.bench.cases.push({ id:c.id, label:c.subject||'' });
  const order=cases.map(t=>t.id);
  state.bench.cases.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
  save();
}

/* Switching mode parks the other mode's work in state.stash so BYOM rows (and
   the demo picks) survive a round trip through the Welcome screen. */
function setMode(next){
  if(next!=='demo' && next!=='byom') return;
  if(next===state.mode) return;
  state.stash = state.stash || {};
  state.stash[state.mode] = { models:state.reg.models, cases:state.bench.cases, path:state.path };
  state.mode = next;
  const back = state.stash[next];
  if(back){
    state.reg.models = back.models || [];
    state.bench.cases = (back.cases && back.cases.length) ? back.cases : [{ id:'TC001', label:'' }];
    if(next==='byom' && back.path) state.path = back.path;
  }
  if(next==='demo') ensureCatalog().then(()=>{ syncDemoSelections(); if(STEPS[state.step].key!=='welcome') renderStep(); });
  save();
}

/* Pull the REAL registry + computed results from the pipeline so the whole
   wizard runs live. Falls back to baked data if the server isn't reachable. */
async function boot(){
  await ensureCatalog();                 // never throws; falls back to the bundled copy
  try{
    const reg = await api.registry();
    state.path = reg.path || 'BYOM';
    // The server persists which mode last wrote the registry; honour it so a
    // reload / reset lands the visitor back in the same flow.
    if(reg.mode==='demo' || reg.mode==='byom') state.mode=reg.mode;
    const demo = state.mode==='demo';
    state.reg.models = reg.models.map(m=>({
      name:m.name, vendor:(m.metadata&&m.metadata.vendor)||'',
      credits:(m.metadata&&m.metadata.credits)||'',
      source:m.source, format:m.format, catalogId: demo?m.id:undefined }));
    state.bench.cases = reg.benchmark.map(b=>({ id:b.id, label:b.subject||'' }));
    if(reg.judge) state.judge = { ...state.judge, ...reg.judge };
    // reflect the pipeline's real fusion settings in the wizard controls
    try{ const st=await api.settings();
      state.settings.mcda = st.fusion.mcda_method;
      state.settings.wSub = Math.round(st.fusion.subjective_weight*100);
      state.settings.wObj = 100 - state.settings.wSub;
    }catch(e){}
    const res = await api.results();
    PENDING = !!res.pending;             // fresh benchmark, no votes computed yet
    MODELS = res.models.map((m,i)=>({ id:m.id||('M'+(i+1)), name:m.name, vendor:(m.metadata&&m.metadata.vendor)||'',
      credits: Math.round((res.gen_seconds&&res.gen_seconds[m.id])||0) }));
    FUSED = res.fused.map(r=>({ rank:r.rank, model:r.model, fused:r.fused,
      sub:r.sub, obj:r.obj, worst:r.worst }));
    DIMS = res.dims; PARAM_ELO = res.param_elo; PAIRWISE = res.pairwise || {};
    LIVE = true;
  }catch(e){ console.warn('backend unavailable — using baked fallback data', e); }
  const pill=document.getElementById('livepill');
  if(pill){
    if(LIVE){ pill.textContent='● LIVE'; pill.style.color='#4ade80'; pill.style.borderColor='#4ade80';
              pill.title='Wired to the running pipeline (main.py)'; }
    else    { pill.textContent='◍ OFFLINE (baked)';
              pill.title='Backend not reachable — start it with: python3 main.py'; }
  }
  if(state.mode==='demo') syncDemoSelections();
  save();
}

/* The live Layer 2 gate panel — shared by the demo picker and the BYOM uploader,
   because both end up feeding the same validator. */
function l2Card(){
  return LIVE ? `<div class="card tint-input" id="l2val">
    <h3>Input validation <span class="pill">Layer 2 · live</span></h3>
    <p class="desc">Live pre-flight check of the model set on disk against the registry (naming · format · duplicates · full coverage), served by <span class="kbd">byom_validator.py</span>.</p>
    <div id="l2rows"><span class="hintline" style="margin:0">running checks…</span></div></div>` : '';
}
function wireL2(el){
  const vrows=el.querySelector('#l2rows');
  if(!vrows) return;
  api.validate().then(rep=>{
    vrows.innerHTML = `<div style="margin-bottom:10px"><span class="pill ${rep.ok?'ok':''}" style="${rep.ok?'':'color:var(--B);border-color:var(--B)'}">${rep.ok?'✓ ALL CHECKS PASSED':'✗ VALIDATION FAILED'}</span></div>`
      // An advisory row never gates the run (see byom_validator: unregistered
      // meshes are ignored, not errors), so it reads "NOTE · N ignored" rather
      // than "PASS · N issue(s)" — which would look like a contradiction.
      + (rep.checks||[]).map(c=>`<div class="pr" style="justify-content:flex-start; gap:10px">
          <span class="pill ${c.advisory?'':(c.ok?'ok':'')}" style="${c.advisory?'color:var(--muted);border-color:var(--line2)':(c.ok?'':'color:var(--B);border-color:var(--B)')}">${c.advisory?'NOTE':(c.ok?'PASS':'FAIL')}</span>
          <span>${escapeHtml(c.name)}</span>
          ${c.details&&c.details.length?`<span class="hintline" style="margin:0">— ${escapeHtml(c.details.length+(c.advisory?' ignored':' issue(s)'))}</span>`:''}
        </div>`).join('');
  }).catch(()=>{ vrows.innerHTML='<span class="lwarn">validator unreachable</span>'; });
}

// One card per example; header + (BYOM) bulk-zip dropbox + one input row per model.
function exampleBlock(tc, idx, models, byoa){
  const div=document.createElement('div'); div.className='card'; div.style.cssText='margin-top:16px';
  const filled = byoa
    ? models.filter(m=>{ const v=state.inputs[tc.id+'|'+m.id]; return v && (v.prompt||'').trim(); }).length
    : models.filter(m=> state.uploads.some(u=>u.tc===tc.id && u.modelId===m.id && u.ok)).length;
  div.innerHTML = `
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:14px">
      <span class="mid mono" style="font-size:12px">${tc.id}</span>
      <input type="text" data-lbl style="max-width:220px" placeholder="label e.g. ${EG_LABELS[idx]||'—'}" value="${escapeHtml(tc.label)}">
      <span style="flex:1"></span>
      <span class="pill ${filled===models.length?'ok':''}">${filled} / ${models.length} ${byoa?'prompts':'meshes'}</span>
    </div>
    ${!byoa ? `
    <div class="drop" data-bulk style="padding:20px 18px; margin-bottom:6px">
      <div class="di" style="font-size:26px">🗜️</div>
      <div class="dt" style="font-size:13.5px">Drop <b>${tc.id}</b>.zip — fills every model at once</div>
      <div class="ds">each .glb is matched to a model by the name in its filename · or drop per model below</div>
    </div>
    <input type="file" data-bulkfile accept=".glb,.gltf,.obj,.fbx,.zip" multiple style="display:none">
    <div class="hintline" style="margin:0 0 6px">— or drop each model's mesh individually —</div>` : ''}
    <div data-rows></div>`;
  div.querySelector('[data-lbl]').oninput=e=>{ tc.label=e.target.value; save(); };
  if(!byoa){
    const bulk=div.querySelector('[data-bulk]'), bf=div.querySelector('[data-bulkfile]');
    bulk.onclick=()=>bf.click();
    bf.onchange=()=>{ ingestFiles(bf.files, tc.id, {match:true}, bulk); bf.value=''; };
    bulk.ondragover=e=>{e.preventDefault();bulk.classList.add('over');};
    bulk.ondragleave=()=>bulk.classList.remove('over');
    bulk.ondrop=e=>{e.preventDefault();bulk.classList.remove('over');ingestFiles(e.dataTransfer.files, tc.id, {match:true}, bulk);};
  }
  const rows=div.querySelector('[data-rows]');
  models.forEach(m=> rows.appendChild(byoa ? byoaModelRow(tc,m) : byomModelRow(tc,m)) );
  return div;
}

// BYOM: model row = an uploaded-mesh card, or a small drop target for that model's .glb.
function byomModelRow(tc,m){
  const u=state.uploads.find(x=>x.tc===tc.id && x.modelId===m.id);
  const row=document.createElement('div');
  row.style.cssText='display:flex; align-items:center; gap:14px; padding:10px 0; border-top:1px solid var(--line)';
  row.innerHTML=`<div style="width:160px; flex:none"><span class="mid mono">${m.id}</span> <span style="font-size:13px">${escapeHtml(m.label)}</span></div><div style="flex:1" data-cell></div>`;
  const cell=row.querySelector('[data-cell]');
  if(u){
    cell.innerHTML=`<div class="ucard" style="max-width:300px">
      <div class="uthumb" data-view style="height:120px"><span class="ph">${u.ok?'▶ click to render':'—'}</span></div>
      <div class="ubody"><div class="un">${escapeHtml(u.name)}</div>
        <div class="urow">${u.ok?'<span class="pill ok">valid</span>':`<span class="pill bad">${escapeHtml(u.warn)||'invalid'}</span>`}
        <button class="xbtn" data-del title="remove">✕</button></div></div></div>`;
    cell.querySelector('[data-del]').onclick=()=>{ try{if(u.url.startsWith('blob:'))URL.revokeObjectURL(u.url);}catch(e){} state.uploads.splice(state.uploads.indexOf(u),1); save(); renderInput(); };
    const th=cell.querySelector('[data-view]');
    if(u.ok){ th.style.cursor='pointer'; th.onclick=()=>{ if(th.dataset.rendered)return; th.dataset.rendered='1'; th.innerHTML=''; mountThumb(th,u.url); }; }
  } else {
    cell.innerHTML=`<div class="drop" data-drop style="padding:13px 16px; text-align:left; display:flex; align-items:center; gap:12px">
        <span style="font-size:20px">⬆️</span>
        <span style="font-size:12.5px; color:var(--muted)">drop <b>${escapeHtml(m.label)}</b>'s .glb · <a data-sample style="cursor:pointer; color:var(--input)" title="${escapeHtml(sampleFor(m).label)} — fetched from the project and uploaded for real">use sample (${escapeHtml(sampleFor(m).label)})</a></span>
      </div><input type="file" data-file accept=".glb,.gltf,.obj,.fbx" style="display:none">`;
    const drop=cell.querySelector('[data-drop]'), file=cell.querySelector('[data-file]');
    drop.onclick=e=>{ if(e.target.dataset.sample!==undefined) return; file.click(); };
    cell.querySelector('[data-sample]').onclick=e=>{ e.stopPropagation(); loadSampleInto(tc.id, m.id); };
    file.onchange=()=>{ ingestFiles(file.files, tc.id, {forceModelId:m.id}, drop); file.value=''; };
    drop.ondragover=e=>{e.preventDefault();drop.classList.add('over');};
    drop.ondragleave=()=>drop.classList.remove('over');
    drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');ingestFiles(e.dataTransfer.files, tc.id, {forceModelId:m.id}, drop);};
  }
  return row;
}

// parse a file name OR full zip path -> {model, tc}. Accepts both "Meshy_tc001.glb"
// and benchmark-style "TC001 GLB/TC001_Meshy 6 Preview.glb" (tc anywhere in the path).
function parseName(path){
  const full=String(path).replace(/\\/g,'/');
  const base=full.split('/').pop().replace(/\.[^.]+$/,'');
  let tc=null;
  const m=full.match(/tc0*?(\d{1,3})/i);          // search the whole path (covers folders)
  if(m) tc='TC'+String(+m[1]).padStart(3,'0');
  let model=base.replace(/tc0*\d{1,3}/i,'').replace(/^[_\-\s]+|[_\-\s]+$/g,'').trim();
  if(!model) model=base;
  const warn = !tc ? 'no test-case id (tc00x) found' : null;
  return {tc, model, warn};
}

// Match a parsed model name / filename to one of the registered models (fuzzy, case-insensitive).
function matchModel(parsed, fileName){
  const models=validModels(); const p=(parsed||'').toLowerCase(); const f=(fileName||'').toLowerCase();
  return models.find(m=>{ const l=(m.label||'').toLowerCase(); return l && (f.includes(l) || (p && (l.includes(p)||p.includes(l)))); }) || null;
}

// Ingest dropped files/zip into an example (tcId).
//   opts.forceModelId -> assign every file to that model cell (per-model drop)
//   opts.match        -> match each file to a registered model by name (bulk zip)
async function ingestFiles(fileList, tcId, opts, dropEl){
  const unmatched=[];
  for(const f of [...fileList]){
    if(/\.zip$/i.test(f.name) || /zip/i.test(f.type||'')){
      const saved=dropEl?dropEl.innerHTML:'';
      if(dropEl) dropEl.innerHTML='<div class="di" style="font-size:26px">🗜️</div><div class="dt" style="font-size:13.5px">Unzipping '+escapeHtml(f.name)+'…</div><div class="ds">reading archive in-browser…</div>';
      try{
        const entries=await extractZip(f);
        if(!entries.length) alert('No .glb / .obj / .fbx files found inside '+f.name);
        entries.forEach(e=>{ const u=addUploadRec(e.name, e.blob, tcId, opts); if(u) unmatched.push(u); });
      }catch(err){ console.error(err); alert('Could not read '+f.name+':\n'+err.message); }
      if(dropEl) dropEl.innerHTML=saved;
    } else { const u=addUploadRec(f.name, f, tcId, opts); if(u) unmatched.push(u); }
  }
  if(unmatched.length) alert('These files didn\'t match any registered model name (skipped):\n• '+unmatched.join('\n• ')
    +'\n\nRename so the model name appears in the filename, or drop them into a model row directly.');
  save(); renderInput();
}

// Adds/replaces the upload for a (tcId, modelId) cell. Returns a filename string if it
// couldn't be matched to a model (bulk mode only), else null.
function addUploadRec(path, blob, tcId, opts){
  const name=String(path).replace(/\\/g,'/').split('/').pop();
  const ext=(name.split('.').pop()||'').toLowerCase();
  const okFmt=['glb','gltf','obj','fbx'].includes(ext);
  const parsed=parseName(path);
  let modelId=opts.forceModelId||null;
  if(!modelId && opts.match){ const m=matchModel(parsed.model, name); if(m) modelId=m.id; else return name; }
  if(modelId){ // one mesh per (tc, model): replace any existing
    const ix=state.uploads.findIndex(u=>u.tc===tcId && u.modelId===modelId);
    if(ix>=0){ try{ if(state.uploads[ix].url.startsWith('blob:')) URL.revokeObjectURL(state.uploads[ix].url); }catch(e){} state.uploads.splice(ix,1); }
  }
  const url=URL.createObjectURL(blob);
  const rec={ name, size:blob.size||0, tc:tcId, modelId, model:parsed.model,
    ok:okFmt, ext, warn: okFmt?null:'unsupported format', url, isSample:false, synced:false };
  state.uploads.push(rec);
  // Write-through: land the mesh on disk under its canonical TC00x_Name.ext so
  // the real pipeline (Layer 2 gate → Layer 4 indexer) can find it.
  if(LIVE && okFmt && modelId){ pushUpload(rec, blob); }
  return null;
}

// base64-encode a blob and POST it to /api/upload. Names the file from the
// REGISTERED model label (not the dropped filename), so it always matches the
// registry regardless of what the user's file was called.
async function pushUpload(rec, blob){
  try{
    const label=(validModels().find(m=>m.id===rec.modelId)||{}).label||rec.model||rec.modelId;
    const buf=new Uint8Array(await blob.arrayBuffer());
    let bin=''; for(let i=0;i<buf.length;i++) bin+=String.fromCharCode(buf[i]);
    const res=await api.upload({ tc:rec.tc, model_name:label, ext:rec.ext,
      content_b64:btoa(bin) });
    rec.synced=true; rec.serverPath=res.path; save();
  }catch(e){ console.warn('upload sync failed', rec.name, e); rec.warn='not saved to server: '+e.message; save(); }
}

// Minimal in-browser ZIP reader (no library). Handles stored (0) + deflate (8) entries,
// which is what macOS "Compress" and `zip` produce. Uses native DecompressionStream.
async function extractZip(file){
  const buf=new Uint8Array(await file.arrayBuffer());
  const dv=new DataView(buf.buffer);
  let eocd=-1; const floor=Math.max(0, buf.length-65557-22);
  for(let i=buf.length-22; i>=floor; i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error('not a valid .zip (no end-of-central-directory)');
  const count=dv.getUint16(eocd+10,true);
  let off=dv.getUint32(eocd+16,true);
  const raw=[];
  for(let n=0;n<count && off+46<=buf.length;n++){
    if(dv.getUint32(off,true)!==0x02014b50) break;           // central directory header
    const method=dv.getUint16(off+10,true);
    const compSize=dv.getUint32(off+20,true);
    const nameLen=dv.getUint16(off+28,true);
    const extraLen=dv.getUint16(off+30,true);
    const commentLen=dv.getUint16(off+32,true);
    const localOff=dv.getUint32(off+42,true);
    const name=new TextDecoder().decode(buf.subarray(off+46, off+46+nameLen));
    off+=46+nameLen+extraLen+commentLen;
    if(name.endsWith('/') || name.split('/').pop().startsWith('.')) continue;  // dirs, __MACOSX/._ junk
    const ext=(name.split('/').pop().split('.').pop()||'').toLowerCase();
    if(!['glb','gltf','obj','fbx'].includes(ext)) continue;
    raw.push({name, method, compSize, localOff});
  }
  const out=[];
  for(const e of raw){
    const lhNameLen=dv.getUint16(e.localOff+26,true);
    const lhExtraLen=dv.getUint16(e.localOff+28,true);
    const dataStart=e.localOff+30+lhNameLen+lhExtraLen;
    const comp=buf.subarray(dataStart, dataStart+e.compSize);
    let data;
    if(e.method===0) data=comp;                              // stored
    else if(e.method===8) data=await inflateRaw(comp);       // deflate
    else continue;                                           // unsupported method
    out.push({name:e.name, blob:new Blob([data])});
  }
  return out;
}

async function inflateRaw(bytes){
  if(typeof DecompressionStream==='undefined') throw new Error('this browser lacks DecompressionStream — use a stored/uncompressed zip');
  const s=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}

// Which sample belongs to a given model row: the one whose key matches the
// registered name, else a stable per-row rotation (NOT always the first one).
function sampleFor(m){
  const label=String((m&&m.label)||'').toLowerCase();
  const hit=SAMPLE_GLBS.find(s=>label.includes(s.key));
  if(hit) return hit;
  const ix=Math.max(0, validModels().findIndex(x=>x.id===(m&&m.id)));
  return SAMPLE_GLBS[ix % SAMPLE_GLBS.length];
}

// Quick-test convenience: load one real benchmark GLB into a specific
// (example, model) cell. It fetches the actual file and runs it through the
// normal ingest path, so the mesh really lands on the server via /api/upload
// and satisfies the Layer 2 gate — not just the UI.
async function loadSampleInto(tcId, modelId){
  const m=validModels().find(x=>x.id===modelId);
  const s=sampleFor(m||{id:modelId});
  try{
    const r=await fetch(encodeURI(s.file));
    if(!r.ok) throw new Error(r.status+' '+r.statusText);
    const blob=await r.blob();
    // same path as a dropped file: replaces the cell + write-through upload
    addUploadRec(s.file.split('/').pop(), blob, tcId, {forceModelId:modelId});
    const rec=state.uploads.find(u=>u.tc===tcId && u.modelId===modelId);
    if(rec) rec.isSample=true;
    save(); renderInput();
  }catch(e){
    alert('Could not load the sample mesh:\n'+s.file+'\n\n'+e.message
      +'\n\nSamples are served from the project folder — they need the server running (python3 main.py).');
  }
}

function drawGraph(host, models){
  const N=models.length, W=440, H=380, cx=W/2, cy=H/2, R=Math.min(W,H)/2-46;
  const pts=models.map((m,i)=>{ const a=-Math.PI/2 + i*2*Math.PI/N; return {id:m.id,x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)}; });
  let edges='';
  for(let i=0;i<N;i++) for(let j=i+1;j<N;j++)
    edges+=`<line x1="${pts[i].x}" y1="${pts[i].y}" x2="${pts[j].x}" y2="${pts[j].y}" stroke="#2b3446" stroke-width="1"/>`;
  const nodes=pts.map(p=>`
    <g><circle cx="${p.x}" cy="${p.y}" r="19" fill="#1c2432" stroke="#4ade80" stroke-width="1.5"/>
    <text x="${p.x}" y="${p.y+4}" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="#e8ebf2">${p.id}</text></g>`).join('');
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">${edges}${nodes}</svg>`;
}

// Assemble the write-through registry payload from wizard state. Sent to
// POST /api/registry, which is id-stable by name (see main.save_registry).
//   mode:'demo' — the server ignores everything but models[].name / benchmark[].id
//                 and copies the matching catalog entries verbatim (ids, match
//                 rules, vendor, credits), which is what keeps ids stable.
//   mode:'byom' — the rows below are the registry, exactly as before.
function registryPayload(){
  const demo=isDemo();
  return {
    mode: demo?'demo':'byom',
    path: demo?'BYOM':state.path,
    judge: state.judge,
    models: state.reg.models.map(m=>({
      name:(m.name||'').trim(), vendor:m.vendor||'', credits:m.credits||'',
      source:demo?'BYOM':state.path, format:m.format||'glb',
      endpoint:demo?'':(m.endpoint||''), api_key_env:m.api_key_env||'' })),
    benchmark: state.bench.cases.map(c=>({ id:c.id, subject:c.label||'' })),
  };
}

async function runAndVote(el, byom){
  const log=el.querySelector('#log'); const fill=el.querySelector('#pfill');
  const line=(html)=>{ log.innerHTML+=html+'<br>'; log.scrollTop=log.scrollHeight; };
  if(!LIVE){
    line('<span class="lwarn">Offline — start the server with <b>python3 main.py</b> to run the pipeline and vote.</span>');
    fill.style.width='100%'; return;
  }
  try{
    line('<span class="lg">[persist] saving registry to the pipeline…</span>'); fill.style.width='18%';
    await api.saveRegistry(registryPayload());
    line(`<span class="lg">[L2→L5] ${isDemo()?'unpack bundled zips → ':''}validate → pairs → extract metrics → cache…</span>`); fill.style.width='45%';
    const r=await api.schedule({});
    fill.style.width='100%';
    line(`<span class="lok">✓ ready — ${r.ready}/${r.matchups} matchups prepared, ${r.viewer_entries} to vote on</span>`);
    state.scheduled=true; save();
    mountVoteViewer(el.querySelector('#votehost'));
    // collapse the prep card once done so voting is the focus
    const pc=el.querySelector('#prepcard'); if(pc){ pc.style.opacity='.6'; }
  }catch(e){
    line(`<span class="lwarn">pipeline failed: ${escapeHtml(e.message)}</span>`);
    line(isDemo()
      ? '<span class="hintline">Most often this is the Layer 2 gate — a selected test case is missing a mesh for one of the selected generators. Try a different combination on the Registry / Input steps.</span>'
      : '<span class="hintline">Most often this is the Layer 2 gate — every test case needs one mesh per model, named correctly. Check the Input step.</span>');
  }
}

        <select id="setPareto"><option value="0">off</option><option value="1">flag dominated</option></select></label>
      <button class="btn primary sm" id="applyFusion">Apply &amp; re-fuse</button>
      <span id="fusionMsg" class="hintline" style="margin:0"></span>
    </div>
  </div>`:''}
  <div class="grid2" style="margin-top:20px">
    <div class="chartcard"><h4>Per-parameter ELO</h4><p class="csub">Subjective strengths — top 3 models</p><div id="radar"></div>
      <div class="legendrow" id="radarleg"></div></div>
    <div class="chartcard"><h4>Speed vs quality</h4><p class="csub">Avg generation time (s) vs fused score</p><div id="scatter"></div></div>
  </div>
  <div class="chartcard" style="margin-top:20px">
    <h4>Objective dimension breakdown</h4><p class="csub">Mean 0–100 rubric per model (Layer 6B)</p><div id="dimchart"></div>
    <div class="legendrow" id="dimleg"></div>
  </div>
  <div class="chartcard" style="margin-top:20px">
    <h4>Pairwise win matrix <span style="font-weight:400;color:var(--muted)">· the Bradley-Terry input</span></h4>
    <p class="csub">How often the <b>row</b> model beat the <b>column</b> model (ties = ½), summed across test cases — the raw evidence the ELO is fit from.
      <select id="pwParam" style="margin-left:8px;width:auto;display:inline-block;padding:4px 8px">${PARAMS.map(p=>`<option value="${p[0]}" ${p[0]==='overall'?'selected':''}>${p[1]}</option>`).join('')}</select></p>
    <div id="pwmatrix" style="overflow-x:auto"></div>
  </div>`;
  drawPodium(el.querySelector('#podium'));
  renderRichBoard(el.querySelector('#richboard'), 'fused');
  drawRadar(el.querySelector('#radar'), el.querySelector('#radarleg'));
  drawScatter(el.querySelector('#scatter'));
  drawDims(el.querySelector('#dimchart'), el.querySelector('#dimleg'));
  const pwSel=el.querySelector('#pwParam'), pwHost=el.querySelector('#pwmatrix');
  if(pwSel){ drawPairwise(pwHost, pwSel.value); pwSel.onchange=()=>drawPairwise(pwHost, pwSel.value); }
  // category pills re-rank the board (and sync the matrix to the same axis)
  el.querySelectorAll('#axisPills .pill2').forEach(b=>b.onclick=()=>{
    el.querySelectorAll('#axisPills .pill2').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    const ax=b.dataset.axis; renderRichBoard(el.querySelector('#richboard'), ax);
    if(pwSel && ax!=='fused'){ pwSel.value=ax; drawPairwise(pwHost, ax); }
  });
  el.querySelector('#expCsv').onclick=()=>exportData('csv');
  el.querySelector('#expJson').onclick=()=>exportData('json');

  const wS=el.querySelector('#setW'), wL=el.querySelector('#wLbl');
  if(wS) wS.oninput=()=>{ wL.textContent=wS.value+'%'; };
  const apply=el.querySelector('#applyFusion');
  if(apply) apply.onclick=async()=>{
    const msg=el.querySelector('#fusionMsg');
    apply.disabled=true; msg.textContent='saving settings…';
    try{
      state.settings.mcda=el.querySelector('#setMethod').value;
      state.settings.wSub=+wS.value; state.settings.wObj=100-(+wS.value); save();
      await api.saveSettings({ fusion:{
        mcda_method:state.settings.mcda,
        subjective_weight:(+wS.value)/100,
        pareto_filter: el.querySelector('#setPareto').value==='1' }});
      msg.textContent='re-fusing from existing votes…';
      await postJSON('/api/refresh',{});           // hybrid→aggregate→fuse→leaderboard
      const res=await api.results();               // pull fresh numbers
      FUSED=res.fused.map(r=>({rank:r.rank,model:r.model,fused:r.fused,sub:r.sub,obj:r.obj,worst:r.worst}));
      DIMS=res.dims; PARAM_ELO=res.param_elo; PAIRWISE=res.pairwise||{};
      MODELS=res.models.map((m,i)=>({id:m.id||('M'+(i+1)),name:m.name,vendor:(m.metadata&&m.metadata.vendor)||'',credits:Math.round((res.gen_seconds&&res.gen_seconds[m.id])||0)}));
      RENDERERS.results(el);                        // re-render with new data
    }catch(e){ msg.textContent='failed: '+e.message; apply.disabled=false; }
  };
};

/* ============================================================= *
 *  CHARTS (pure SVG)                                            *
 * ============================================================= */
const PAL=['#4ade80','#5b8bf0','#f0a94a','#a78bfa','#f2555a','#4dd0e1','#e0a32e'];

// Top-3 podium with vertical bars (the "full leaderboard" viz, brought up top).
// Arranged 2·1·3, bar height scaled to fused score, #1 gold + tallest.
function drawPodium(host){
  if(!host) return;
  const top=FUSED.slice(0,3); if(top.length<3){ host.innerHTML=''; return; }
  const order=[top[1],top[0],top[2]];                 // 2 · 1 · 3
  const min=Math.min(...top.map(r=>r.fused)), max=Math.max(...top.map(r=>r.fused)), span=(max-min)||1;
  host.innerHTML=order.map(r=>{
    const m=MODELS.find(x=>x.id===r.model)||{}, first=r.rank===1;
    const h=90+130*(r.fused-min)/span;                // 90..220px by score
    const grad=first?'linear-gradient(180deg,#e0a32e,#9c6f1c)':'linear-gradient(180deg,#3a5f8f,#243a55)';
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:150px;text-align:center">
      ${first?'<div style="font-size:20px;color:var(--gold)">★</div>':'<div style="height:20px"></div>'}
      <div style="width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;
        background:${first?'var(--gold)':'#1c2432'};color:${first?'#0a0c11':'var(--txt)'};border:1px solid ${first?'var(--gold)':'var(--line2)'}">${r.rank}</div>
      <div style="font-size:14px;font-weight:650">${m.name||r.model}</div>
      <div style="font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">${r.model}</div>
      <div style="font-size:22px;font-weight:740;color:${first?'var(--gold)':'var(--txt)'}">${r.fused.toFixed(0)}</div>
      <div style="width:100%;height:${h.toFixed(0)}px;border-radius:10px 10px 0 0;background:${grad}"></div>
    </div>`;
  }).join('');
}

// Wins/losses per model from the pairwise matrix of an axis (ties count as ½).
function axisWinLoss(axis){
  const W=((PAIRWISE[axis]||{}).wins)||{}, ids=MODELS.map(m=>m.id), out={};
  ids.forEach(a=>{ let w=0,l=0; ids.forEach(b=>{ if(a===b) return; w+=(W[a]||{})[b]||0; l+=(W[b]||{})[a]||0; });
    out[a]={w,l,rate:(w+l)?w/(w+l):0}; });
  return out;
}
// Feature tags derived from the objective dimensions (like top3d's tool tags).
function modelTags(mid){
  const d=DIMS[mid]||{}, t=[];
  if(d.integrity>=55) t.push('Watertight'); else if(d.integrity>=38) t.push('Clean topology');
  if(d.texturing>=68) t.push('HD texture'); else if(d.texturing>=50) t.push('PBR');
  if(d.symmetry>=68) t.push('Symmetric');
  if(d.efficiency>=68) t.push('Low-poly'); else if(d.efficiency<=22) t.push('High-poly');
  return t.slice(0,3);
}
const fmtN=v=>(+v).toFixed(1).replace(/\.0$/,'');
// Rich ranked board (top3d.ai style): rank · model+tags+cost · ELO · W · L · win-rate.
function renderRichBoard(host, axis){
  if(!host) return;
  const isFused=axis==='fused', pwAxis=isFused?'overall':axis, wl=axisWinLoss(pwAxis);
  const rows = isFused
    ? FUSED.map(r=>({id:r.model, elo:r.fused}))
    : MODELS.map(m=>({id:m.id, elo:(PARAM_ELO[m.id]||{})[axis]||0})).sort((a,b)=>b.elo-a.elo);
  host.innerHTML=rows.map((r,i)=>{
    const m=MODELS.find(x=>x.id===r.id)||{}, rank=i+1, first=rank===1, lw=wl[r.id]||{w:0,l:0,rate:0};
    const cost=m.credits?`<span class="tag2 cost">~${m.credits}s / gen</span>`:'';
    const tags=modelTags(r.id).map(t=>`<span class="tag2">${t}</span>`).join('');
    return `<div class="lbrow${first?' first':''}">
      <div class="lc-rank"><span class="rankb${first?' gold':''}">${rank}</span></div>
      <div class="lc-model"><div class="mname">${escapeHtml(m.name||r.id)}<span class="mvend">${escapeHtml(m.vendor||'')}</span></div>
        <div class="mtags">${cost}${tags}</div></div>
      <div class="lc-num"><b class="elo${first?' gold':''}">${Math.round(r.elo)}</b></div>
      <div class="lc-num">${fmtN(lw.w)}</div><div class="lc-num">${fmtN(lw.l)}</div>
      <div class="lc-num">${Math.round(lw.rate*100)}%</div>
    </div>`;
  }).join('');
}

function drawBar(host){
  const data=[...FUSED]; const W=880,H=data.length*46+30, L=170, R=70;
  const min=Math.min(...data.map(d=>d.fused)), max=Math.max(...data.map(d=>d.fused));
  const span=(max-min)||1; const bw=W-L-R;
  const rows=data.map((d,i)=>{
    const y=i*46+14; const pct=0.18+0.82*(d.fused-min)/span; const w=bw*pct;
    const c=d.rank===1?'var(--gold)':'#3a5f8f';
    return `<text x="${L-12}" y="${y+21}" text-anchor="end" font-size="12" fill="#e8ebf2">${d.rank}. ${baseName(d.model)}</text>
      <rect x="${L}" y="${y+6}" width="${bw}" height="22" rx="6" fill="#0f1420"/>
      <rect x="${L}" y="${y+6}" width="${w}" height="22" rx="6" fill="${c}"/>
      <text x="${L+w+8}" y="${y+21}" font-size="12" font-family="ui-monospace,monospace" fill="${d.rank===1?'var(--gold)':'#8a93a6'}">${d.fused.toFixed(0)}</text>`;
  }).join('');
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%">${rows}</svg>`;
}

function drawRadar(host, leg){
  const top=FUSED.slice(0,3).map(d=>d.model);
  const axes=PARAMS; const N=axes.length; const W=440,H=360,cx=W/2,cy=H/2+6,R=125;
  const lo=900,hi=1650; const norm=v=>(v-lo)/(hi-lo);
  const ang=i=>-Math.PI/2 + i*2*Math.PI/N;
  let grid='';
  for(let g=1;g<=4;g++){ const rr=R*g/4;
    grid+=`<polygon points="${axes.map((_,i)=>`${cx+rr*Math.cos(ang(i))},${cy+rr*Math.sin(ang(i))}`).join(' ')}" fill="none" stroke="#232b3a" stroke-width="1"/>`; }
  const labels=axes.map((a,i)=>{ const x=cx+(R+22)*Math.cos(ang(i)), y=cy+(R+22)*Math.sin(ang(i));
    return `<text x="${x}" y="${y+4}" text-anchor="middle" font-size="11">${a[1]}</text>`; }).join('');
  const polys=top.map((mid,k)=>{
    const pts=axes.map((a,i)=>{ const r=R*Math.max(0,Math.min(1,norm(PARAM_ELO[mid][a[0]]))); return `${cx+r*Math.cos(ang(i))},${cy+r*Math.sin(ang(i))}`; }).join(' ');
    return `<polygon points="${pts}" fill="${PAL[k]}22" stroke="${PAL[k]}" stroke-width="2"/>`;
  }).join('');
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">${grid}${labels}${polys}</svg>`;
  leg.innerHTML=top.map((mid,k)=>`<span class="lk"><span class="sw" style="background:${PAL[k]}"></span>${baseName(mid)}</span>`).join('');
}

function drawScatter(host){
  const W=440,H=340, pad=48;
  const xs=FUSED.map(d=>MODELS.find(m=>m.id===d.model).credits);
  const ys=FUSED.map(d=>d.fused);
  const xmin=Math.min(...xs)-15,xmax=Math.max(...xs)+15, ymin=Math.min(...ys)-40,ymax=Math.max(...ys)+40;
  const X=v=>pad+(W-pad-16)*(v-xmin)/(xmax-xmin);
  const Y=v=>H-pad-(H-pad-16)*(v-ymin)/(ymax-ymin);
  let grid='';
  for(let i=0;i<=4;i++){ const y=pad+i*(H-pad-16)/4; grid+=`<line x1="${pad}" y1="${y}" x2="${W-16}" y2="${y}" stroke="#1c2330"/>`; }
  const axis=`<line x1="${pad}" y1="${H-pad}" x2="${W-16}" y2="${H-pad}" stroke="#2f3849"/>
    <line x1="${pad}" y1="16" x2="${pad}" y2="${H-pad}" stroke="#2f3849"/>
    <text x="${(W)/2}" y="${H-12}" text-anchor="middle" font-size="11">avg generation time (s) →</text>
    <text x="16" y="${H/2}" text-anchor="middle" font-size="11" transform="rotate(-90 16 ${H/2})">fused score →</text>`;
  const dots=FUSED.map((d,i)=>{ const m=MODELS.find(x=>x.id===d.model); const x=X(m.credits),y=Y(d.fused);
    const c=d.rank===1?'var(--gold)':PAL[i%PAL.length];
    return `<circle cx="${x}" cy="${y}" r="8" fill="${c}cc" stroke="${c}"/>
      <text x="${x+11}" y="${y+4}" font-size="10.5" fill="#c9d0dc">${d.model}</text>`; }).join('');
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">${grid}${axis}${dots}</svg>`;
}

function drawDims(host, leg){
  const dims=['integrity','texturing','symmetry','efficiency'];
  const order=FUSED.map(d=>d.model);
  const W=880, groupW=(W-40)/order.length, bw=groupW/(dims.length+1), H=260, base=H-30;
  let bars='';
  order.forEach((mid,gi)=>{
    const gx=20+gi*groupW;
    dims.forEach((dm,di)=>{ const v=DIMS[mid][dm]; const h=(base-20)*v/100;
      bars+=`<rect x="${gx+di*bw+6}" y="${base-h}" width="${bw-3}" height="${h}" rx="2" fill="${PAL[di]}"/>`; });
    bars+=`<text x="${gx+groupW/2}" y="${base+16}" text-anchor="middle" font-size="10.5" fill="#8a93a6">${mid}</text>`;
  });
  bars+=`<line x1="20" y1="${base}" x2="${W-10}" y2="${base}" stroke="#2f3849"/>`;
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%">${bars}</svg>`;
  leg.innerHTML=dims.map((d,i)=>`<span class="lk"><span class="sw" style="background:${PAL[i]}"></span>${d}</span>`).join('');
}

// Pairwise win matrix (Bradley-Terry input): row beat column, ties=½, summed
// across test cases. Rows/cols ordered by the fused leaderboard so the winner
// sits top-left; cell shade = win fraction of that pairing.
function drawPairwise(host, param){
  const order=FUSED.map(d=>d.model);
  const W=(PAIRWISE[param]||{}).wins||{};
  if(!Object.keys(W).length){ host.innerHTML='<p class="csub">No pairwise data (vote first, then refresh).</p>'; return; }
  const cell=(r,c)=>{
    if(r===c) return '<td style="background:#0c0f16;color:var(--muted2)">—</td>';
    const w=(W[r]||{})[c]||0, l=(W[c]||{})[r]||0, tot=w+l;
    const frac=tot?w/tot:0;                                  // 0..1 row-over-col
    const bg=`rgba(74,222,128,${(0.10+0.80*frac).toFixed(2)})`;   // greener = row won more
    const title=`${r} beat ${c} ${w} — ${l} (${tot?Math.round(frac*100):0}%)`;
    return `<td title="${title}" style="background:${bg};color:#0a0c11;font-weight:600">${w}</td>`;
  };
  host.innerHTML=`<table class="tbl" style="min-width:520px;text-align:center">
    <thead><tr><th style="text-align:left">▼ won / ► lost</th>${order.map(c=>`<th style="text-align:center">${c}</th>`).join('')}</tr></thead>
    <tbody>${order.map(r=>`<tr><td style="text-align:left"><span class="mid">${r}</span> ${baseName(r)}</td>${order.map(c=>cell(r,c)).join('')}</tr>`).join('')}</tbody>
  </table>`;
}

function exportData(fmt){
  let blob;
  if(fmt==='json') blob=new Blob([JSON.stringify(FUSED,null,2)],{type:'application/json'});
  else { const head='rank,model,name,fused,subjective_elo,objective,gen_time_s\n';
    const body=FUSED.map(r=>{const m=MODELS.find(x=>x.id===r.model);return [r.rank,r.model,m.name,r.fused,r.sub,r.obj,m.credits].join(',');}).join('\n');
    blob=new Blob([head+body],{type:'text/csv'}); }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='leaderboard.'+fmt; a.click();
}

/* ============================================================= *
 *  THREE.JS THUMBNAIL VIEWERS (BYOM preview)                    *
 * ============================================================= */
let VIEWERS=[];
const loader=new GLTFLoader();
function mountThumb(host, url){
  const w=host.clientWidth||220, h=host.clientHeight||150;
  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(45, w/h, 0.01, 100); cam.position.set(0,0,3);
  const rnd=new THREE.WebGLRenderer({antialias:true, alpha:true});
  rnd.outputColorSpace=THREE.SRGBColorSpace; rnd.setPixelRatio(Math.min(devicePixelRatio,2)); rnd.setSize(w,h);
  host.appendChild(rnd.domElement);
  scene.add(new THREE.HemisphereLight(0xffffff,0x3a3f4c,1.2));
  const d1=new THREE.DirectionalLight(0xffffff,1.4); d1.position.set(2,3,2); scene.add(d1);
  const ctr=new OrbitControls(cam, rnd.domElement); ctr.enableDamping=true; ctr.autoRotate=true; ctr.autoRotateSpeed=2.2;
  const load=document.createElement('div'); load.style.cssText='position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#7e879b;font-size:12px';
  load.textContent='loading…'; host.appendChild(load);
  const rec={rnd, alive:true};
  VIEWERS.push(rec);
  loader.load(url,(g)=>{
    const obj=g.scene; const box=new THREE.Box3().setFromObject(obj); const size=box.getSize(new THREE.Vector3());
    const ctr2=box.getCenter(new THREE.Vector3()); obj.position.sub(ctr2);
    const md=Math.max(size.x,size.y,size.z)||1; const dist=md/(2*Math.tan(THREE.MathUtils.degToRad(22.5)));
    cam.position.set(dist*0.5,dist*0.35,dist*1.4); cam.near=md/100; cam.far=md*100; cam.updateProjectionMatrix();
    scene.add(obj); load.remove();
  }, undefined, (e)=>{ load.textContent='load failed'; console.error(url,e); });
  (function loop(){ if(!rec.alive) return; requestAnimationFrame(loop); ctr.update(); rnd.render(scene,cam); })();
}
function teardownViewers(){ VIEWERS.forEach(v=>{ v.alive=false; try{v.rnd.dispose();}catch(e){} }); VIEWERS=[]; }

/* ============================================================= *
 *  WIRING                                                       *
 * ============================================================= */
document.getElementById('nextBtn').onclick=async ()=>{
  if(state.step<STEPS.length-1){ go(state.step+1); return; }
  // Finish: reset the wizard flow and return the user to screen one (Welcome).
  teardownViewers(); state=defaultState(); await boot(); go(0);
};
document.getElementById('backBtn').onclick=()=>{ if(state.step>0) go(state.step-1); };
document.getElementById('resetBtn').onclick=async ()=>{
  if(!confirm('Reset the wizard? Reloads the live registry and clears local uploads (does not delete server data).')) return;
  teardownViewers(); state=defaultState(); await boot(); go(0);
};

// Restore the frozen example run on the server (the 105 demo ballots + scores),
// then reload the wizard against it. One click back to the showcase leaderboard.
document.getElementById('exampleBtn').onclick=async ()=>{
  if(!LIVE){ alert('Start the server (python3 main.py) to load the example run.'); return; }
  if(!confirm('Load the built-in example run? This restores the demo models + 105 votes on the server.')) return;
  const btn=document.getElementById('exampleBtn'); btn.disabled=true; btn.textContent='…restoring';
  try{ await api.loadExample(); teardownViewers(); state=defaultState(); await boot(); go(STEPS.length-1); }
  catch(e){ alert('Could not load example: '+e.message); }
  finally{ btn.disabled=false; btn.textContent='↺ Load example'; }
};

/* Entry point: always open on the Welcome page (pick BYOM + judge). */
boot().then(()=>{ state.step=0; renderNav(); go(0); });
</script>
